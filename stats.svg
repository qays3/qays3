<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" fill="none" role="img" aria-label="GitHub Stats">
<style>
text { font-family: -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif; }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes show { to { opacity: 1 } }
@keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
.fade { opacity: 0; animation: fade .6s ease forwards }
.grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s ease forwards }
.pulse { animation: pulse 2.4s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important } }
</style>
<rect x=".75" y=".75" width="458.5" height="218.5" rx="16" fill="#0B0716" stroke="#3B1A63" stroke-width="1.5"/>
<text x="26" y="38" font-size="17" font-weight="600" fill="#A855F7">GitHub Stats</text>
<g class="fade" style="animation-delay:0.15s"><circle cx="32" cy="68" r="3" fill="#A855F7"/><text x="44" y="72" font-size="13" fill="#CEC8F2">Total stars</text><text x="300" y="72" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">112</text></g>
<g class="fade" style="animation-delay:0.27s"><circle cx="32" cy="92" r="3" fill="#C084FC"/><text x="44" y="96" font-size="13" fill="#CEC8F2">Commits, last year</text><text x="300" y="96" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">251</text></g>
<g class="fade" style="animation-delay:0.39s"><circle cx="32" cy="116" r="3" fill="#A855F7"/><text x="44" y="120" font-size="13" fill="#CEC8F2">Pull requests</text><text x="300" y="120" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">9</text></g>
<g class="fade" style="animation-delay:0.51s"><circle cx="32" cy="140" r="3" fill="#C084FC"/><text x="44" y="144" font-size="13" fill="#CEC8F2">Issues</text><text x="300" y="144" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">1</text></g>
<g class="fade" style="animation-delay:0.63s"><circle cx="32" cy="164" r="3" fill="#A855F7"/><text x="44" y="168" font-size="13" fill="#CEC8F2">Contributed to</text><text x="300" y="168" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">1</text></g>
<g class="fade" style="animation-delay:0.75s"><circle cx="32" cy="188" r="3" fill="#C084FC"/><text x="44" y="192" font-size="13" fill="#CEC8F2">Contributions, last year</text><text x="300" y="192" font-size="13" font-weight="700" fill="#F3EBDD" text-anchor="end">264</text></g>
<g class="fade" style="animation-delay:.3s"><circle cx="378" cy="112" r="44" stroke="#3B1A63" stroke-width="7"/><circle cx="378" cy="112" r="44" stroke="#A855F7" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" transform="rotate(-90 378 112)"><animate attributeName="stroke-dashoffset" from="276.5" to="162.3" begin=".4s" dur="1.6s" fill="freeze"/></circle><text x="378" y="122" font-size="28" font-weight="800" fill="#F3EBDD" text-anchor="middle">B</text><text x="378" y="178" font-size="12" font-weight="600" fill="#C084FC" text-anchor="middle">Rank B</text><text x="378" y="196" font-size="11" fill="#8F86D8" text-anchor="middle">Top 58.7% on GitHub</text></g>
