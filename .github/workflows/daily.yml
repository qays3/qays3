name: daily activity

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Make a commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          mkdir -p activity
          echo "$(date -u +'%Y-%m-%d %H:%M:%S') entry" >> "activity/$(date -u +%Y).log"
          git add activity
          git commit -m "daily log $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
