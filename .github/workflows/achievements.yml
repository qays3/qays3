name: achievements

on:
  workflow_dispatch:
    inputs:
      pr_count:
        description: "Merged pull requests to make (2 unlocks Pull Shark)"
        required: true
        default: "2"
      co_author:
        description: "Co-author for Pair Extraordinaire, as: Name <email> (leave empty to skip)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.ACHIEVEMENTS_TOKEN }}
      PR_COUNT: ${{ github.event.inputs.pr_count }}
      CO_AUTHOR: ${{ github.event.inputs.co_author }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACHIEVEMENTS_TOKEN }}
          fetch-depth: 0

      - name: Set identity
        run: |
          LOGIN=$(gh api user --jq .login)
          ID=$(gh api user --jq .id)
          git config user.name "$LOGIN"
          git config user.email "$ID+$LOGIN@users.noreply.github.com"
          echo "BASE=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_ENV"

      - name: Quickdraw
        run: |
          URL=$(gh issue create --title "Quickdraw check $(date -u +%F)" --body "Opened and closed right away.")
          sleep 5
          gh issue close "$URL" --comment "Done."

      - name: Pull Shark, YOLO and Pair Extraordinaire
        run: |
          N=$PR_COUNT
          if [ "$N" -gt 16 ]; then N=16; fi
          mkdir -p activity
          for i in $(seq 1 "$N"); do
            B="achievement-$(date -u +%Y%m%d%H%M%S)-$i"
            git checkout -B "$B" "origin/$BASE"
            echo "$(date -u +'%Y-%m-%d %H:%M:%S') pull request $i" >> activity/achievements.log
            git add activity
            if [ "$i" -eq 1 ] && [ -n "$CO_AUTHOR" ]; then
              git commit -m "Achievement log $i" -m "Co-authored-by: $CO_AUTHOR"
            else
              git commit -m "Achievement log $i"
            fi
            git push origin "$B"
            gh pr create --base "$BASE" --head "$B" --title "Achievement log $i" --body "Automatic update."
            gh pr merge "$B" --merge --delete-branch
            git fetch origin "$BASE"
            sleep 3
          done
