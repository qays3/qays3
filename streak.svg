<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-label="Streak">
<style>
text { font-family: -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif; }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes show { to { opacity: 1 } }
@keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
.fade { opacity: 0; animation: fade .6s ease forwards }
.grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s ease forwards }
.pulse { animation: pulse 2.4s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important } }
</style>
<rect x=".75" y=".75" width="898.5" height="198.5" rx="16" fill="#0B0716" stroke="#3B1A63" stroke-width="1.5"/>
<text x="26" y="38" font-size="17" font-weight="600" fill="#A855F7">Streak</text>
<line x1="300" y1="60" x2="300" y2="172" stroke="#3B1A63" stroke-width="1.5"/>
<line x1="600" y1="60" x2="600" y2="172" stroke="#3B1A63" stroke-width="1.5"/>
<g class="fade" style="animation-delay:.2s"><text x="150" y="112" font-size="30" font-weight="800" fill="#F3EBDD" text-anchor="middle">131</text><text x="150" y="142" font-size="13" fill="#CEC8F2" text-anchor="middle">Total contributions</text><text x="150" y="164" font-size="11" fill="#8F86D8" text-anchor="middle">Nov 02, 2025 to Nov 07, 2026</text></g>
<g class="fade" style="animation-delay:.35s"><circle cx="450" cy="102" r="38" stroke="#3B1A63" stroke-width="6"/><circle cx="450" cy="102" r="38" stroke="#A855F7" stroke-width="6" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="238.8" transform="rotate(-90 450 102)"><animate attributeName="stroke-dashoffset" from="238.8" to="0" begin=".4s" dur="1.4s" fill="freeze"/></circle><circle cx="450" cy="62" r="11" fill="#0B0716"/><path class="pulse" d="M450,50 C459,57 460,66 454,72 C455,67 452,64 450,63 C451,68 448,71 446,72 C440,66 443,57 450,50 Z" fill="#C084FC"/><text x="450" y="112" font-size="28" font-weight="800" fill="#F3EBDD" text-anchor="middle">5</text><text x="450" y="164" font-size="13" font-weight="700" fill="#A855F7" text-anchor="middle">Current streak</text><text x="450" y="182" font-size="11" fill="#8F86D8" text-anchor="middle">Nov 03 to Nov 07</text></g>
